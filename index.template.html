<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Harkfell</title>
  <script>
    // A2: the sound renders at ?rate=N Hz (default 32000, the rate Crash's
    // phone measurements chose; ?rate=device for the device's own) and the
    // browser resamples to the device. The WebAudio bridge opens
    // `new AudioContext()` with no options, so the page supplies the rate by
    // wrapping the constructor before the loader runs (the S0 sketchbook's way).
    (function () {
      var p = new URLSearchParams(location.search).get("rate");
      var want = p === "device" ? 0 : Number(p || 32000);
      var Base = window.AudioContext || window.webkitAudioContext;
      // D40: every context is kept, so a pause can suspend it (below)
      window.HARKFELL_CONTEXTS = [];
      if (Base) {
        var Wrapped = function (opts) {
          var c = new Base(want > 0 ? Object.assign({ sampleRate: want }, opts || {}) : opts);
          window.HARKFELL_CONTEXTS.push(c);
          return c;
        };
        Wrapped.prototype = Base.prototype;
        window.AudioContext = Wrapped;
        if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      }
    })();
    // Playtest 1, #1 (a slow load on the phone; the start screen's second
    // line came before the first): the start screen's words and the card's
    // mark are fetched now, while the wasm downloads, and held in memory.
    // The game asks for them later, through the gles3 bridge's fetch (once
    // its frames are steady: (harkfell shell web-images)), and gets these
    // bytes at once, with no network and nothing a long boot frame can
    // cancel. The scale is the game's: the largest whole scale of the
    // 400x176 view that fits the device pixels (and the rounded one, in
    // case), 1..8; the kind is the page's (touch, keys or both); D40's line
    // too when a save is stored. Anything not preloaded, or a preload that
    // failed, goes to the network as before. ?trace: one line of what.
    (function () {
      var params = new URLSearchParams(location.search);
      var dpr = Math.max(1, window.devicePixelRatio || 1);
      var s = Math.min(window.innerWidth * dpr / 400, window.innerHeight * dpr / 176);
      var clamp = function (k) { return Math.max(1, Math.min(8, k)); };
      var ks = [clamp(Math.floor(s)), clamp(Math.round(s))].filter(function (k, i, a) { return a.indexOf(k) === i; });
      var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      var kind = params.get("kind") || (coarse ? "touch" : ((navigator.maxTouchPoints || 0) > 0 ? "both" : "keys"));
      var saved = false;
      try { saved = !!localStorage.getItem("save") && !params.has("new"); } catch (err) { /* private mode */ }
      var urls = [];
      ks.forEach(function (k) {
        ["listen", "step-" + kind, "presents"].concat(saved ? ["over-" + kind] : []).forEach(function (id) {
          urls.push("assets/type/" + id + "@" + k + ".png");
        });
        urls.push("assets/mark/mark@" + k + ".png");
      });
      var held = {};
      var baseFetch = window.fetch.bind(window);
      urls.forEach(function (u) {
        held[u] = baseFetch(u, { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error(u + " " + r.status);
          return r.arrayBuffer();
        });
        held[u].catch(function () { delete held[u]; });
      });
      window.fetch = function (input, init) {
        var u = typeof input === "string" ? input : "";
        if (held[u]) {
          var p = held[u];
          delete held[u];                      // once: a later ask goes to the network
          return p.then(function (buf) { return new Response(buf, { status: 200, headers: { "content-type": "image/png" } }); },
                        function () { return baseFetch(input, init); });
        }
        return baseFetch(input, init);
      };
      if (params.has("trace")) console.log("harkfell: page preload " + urls.length + " images at x" + ks.join(",x") + " " + kind);
    })();
  </script>
  <!-- version: "__VERSION__" -->
  <style>
    /* The page is the room: the canvas fills the viewport and the game
       places the 400x176 view on it at a whole number of DEVICE pixels
       per view pixel ((engine view)), so the canvas must not be scaled by
       CSS beyond its own devicePixelRatio sizing. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
                 overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
             display: block; touch-action: none; user-select: none;
             -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #status { position: fixed; left: 8px; bottom: 8px; color: #aab; font: 13px ui-monospace, monospace; }
    #status:empty, #status [data-sigil-booting] { display: none; }

    /* The touch controls (D17, D25): a stick under the left thumb, a jump
       button under the right. Drawn by the page over the canvas; the page
       tracks the fingers and sends the game a direction, the game decides
       what it means ((engine stick)). */
    #touch { position: fixed; inset: 0; touch-action: none; display: none; z-index: 2;
             -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #touch.on { display: block; }
    #ring, #knob, #jumpbtn { position: absolute; border-radius: 50%; pointer-events: none;
                             box-sizing: border-box; }
    #ring { border: 2px solid rgba(235, 230, 215, 0.35); background: rgba(235, 230, 215, 0.06); }
    #ring.live { border-color: rgba(235, 230, 215, 0.6); }
    #knob { background: rgba(235, 230, 215, 0.45); }
    #jumpbtn { border: 2px solid rgba(235, 230, 215, 0.35); background: rgba(235, 230, 215, 0.08); }
    #jumpbtn.down { background: rgba(235, 230, 215, 0.35); }

    /* The page guard's card: the game died (a trap, a FATAL, a lost WebGL
       context). A tap reloads. No words (D8): a circle arrow. */
    #dead { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center;
            justify-content: center; background: rgba(0, 0, 0, 0.8); color: #ddd; font: 48px sans-serif; }
    #dead[hidden] { display: none; }

    /* ?bench: the measurement's lines, and the tap that starts it */
    #bench { position: fixed; left: 0; right: 0; top: 0; z-index: 4; max-height: 70vh; overflow: auto;
             margin: 0; padding: 8px; background: rgba(0, 0, 0, 0.78); color: #cfe; font: 11px/1.35 ui-monospace, monospace;
             white-space: pre-wrap; word-break: break-all; }
    #bench[hidden] { display: none; }

    /* D39: the fullscreen button. A small, quiet mark in the top-right
       corner, drawn by the page (not the game): on the start screen it
       stays; in play it fades after FS_IDLE_MS without the mouse moving
       (or a touch in the top quarter of the screen) and comes back when it
       moves. Hidden where the Fullscreen API is missing (iPhone Safari).
       Above the touch controls, under the page guard's card. */
    #game { position: fixed; inset: 0; background: #000; }
    #fs { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
          z-index: 3; box-sizing: border-box; width: 34px; height: 34px; padding: 7px; margin: 0; border: 0; border-radius: 6px;
          background: transparent; color: rgb(235, 230, 215); opacity: 0.45; cursor: pointer;
          transition: opacity 0.6s ease; -webkit-tap-highlight-color: transparent; }
    #fs:hover, #fs:focus-visible { opacity: 0.85; }
    #fs:focus { outline: none; }
    #fs:focus-visible { outline: 1px solid rgba(235, 230, 215, 0.5); }
    #fs.faded { opacity: 0; pointer-events: none; }
    #fs[hidden] { display: none; }
    #fs svg { display: block; width: 20px; height: 20px; }
    #fs .exit { display: none; }
    #fs.on .enter { display: none; }
    #fs.on .exit { display: block; }
  </style>
</head>
<body>
  <!-- D39: the game's container, what fullscreen takes: the canvas and
       everything the page draws over it -->
  <div id="game">
  <canvas id="stage" width="800" height="352"></canvas>
  <div id="touch">
    <div id="ring"></div>
    <div id="knob"></div>
    <div id="jumpbtn"></div>
  </div>
  <button id="fs" type="button" aria-label="Fullscreen" hidden>
    <svg class="enter" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg>
    <svg class="exit" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M7 2v5H2M18 7h-5V2M13 18v-5h5M2 13h5v5"/></svg>
  </button>
  <div id="dead" hidden>&#x21bb;</div>
  <pre id="bench" hidden></pre>
  <div id="status"></div>
  </div>

  <script>
  // The world's files (world/*.sgl, regions/*.map, rooms/*/*.room) as
  // [path, text] pairs, baked in by the build (package.sgl's stamp step), so
  // the page and the native game read the same text.
  window.HARKFELL_WORLD = __WORLD__;
  </script>
  <script>
  // Harkfell's page. The generic loader (sigil-web-app.js) boots the wasm,
  // forwards keydown/keyup, and publishes SigilWebApp; the gles3 shell
  // runs one frame per requestAnimationFrame. This page adds the touch
  // controls, the parameters, the visibility word, the fullscreen button
  // (D39: the top-right corner, or F) and a small guard.
  //
  // Parameters:
  //   ?stick=fixed|float   the joystick form (D25; fixed by default, David's
  //                        pick after playing both); stored by the game, so
  //                        the phone keeps it until asked otherwise.
  //                        float: the ring rests at its home spot and a
  //                        thumb landing anywhere in the lower-left quarter
  //                        re-centres it; it goes home on lift-off.
  //                        fixed: the ring stays where it is drawn; press
  //                        inside it (half a radius of slack).
  //   ?ms                  the readout: frame, step and draw ms, the scale,
  //                        the stick form, and touch latency (in, move,
  //                        jump: last, average, max of the last 16, ms).
  //   ?touch               show the touch controls without a touch screen.
  //   ?trace               the harkfell: console lines.
  //   ?replay, ?envelope   print the replay trace / the envelope (the gates).
  //   ?room=REGION:X,Y     start in that room, at its door (A1).
  //   &at=C,R              ... standing in cell (C, R) of it instead (testing
  //                        an entrance: column, row from the top-left, 0-based).
  //   ?atlas               every room at quarter scale on the world grid; a
  //                        tap enters the room under it.
  //   ?sheet=REGION        the region's rooms at full scale in one picture (the
  //                        region sheet); a tap enters a room.
  //   ?still               the world does not step (screenshots).
  //   ?test-room           A0's grey test room instead of the world.
  //   ?rate=N|device       the sound's render rate (A2; default 32000).
  //   ?carry=2,3           play as if carrying those harmonics: their drone
  //                        voices sound in the bed (A3's pickups do this).
  //   ?tone=X,Y            the room H2's finding tone sounds from (default
  //                        11,3: a placeholder east of Reedfen's six rooms).
  //   ?new                 (A4) a new game: the save is not read (it is written
  //                        over as you play).
  //   ?frame=off           (A4) straight into the world, no start screen, card
  //                        or opening. Every door above skips them too, and
  //                        never writes the save.
  //   ?bench               the phone measurement (A2, (harkfell bench)): a tap
  //                        starts it; about 3.3 minutes; its lines show at the
  //                        top and are sent to the host (bench-report?LINE), so
  //                        the numbers need no transcribing.
  //   ?sound=a,b           A4, the sound's listening doors: border:through (the
  //                        short cross for heavy beds; the default is A2's 4 s
  //                        crossfade, border:cross), bench:a4 (with ?bench: the
  //                        slice's phases), moment:NAME (that moment plays
  //                        over the bed 4 s after it opens). The card and
  //                        the opening play on every launch (the frame).
  //
  // The guard follows Crash The Stack's page guard (master e737d21) in
  // spirit, much reduced: a FATAL line, a trap out of a dispatch or a lost
  // WebGL context marks the instance dead; after that nothing reaches it
  // and a card offers a reload.
  (function () {
    "use strict";
    var params = new URLSearchParams(location.search);
    var guard = { dead: false };
    var deadCard = document.getElementById("dead");
    function die(why) {
      if (guard.dead) return;
      guard.dead = true;
      console.error("harkfell: page dead " + why);
      deadCard.hidden = false;
    }
    deadCard.addEventListener("click", function () { location.reload(); });

    // ---- A2: the sound's lines -------------------------------------------
    //   harkfell: fetch NAME   the wasm wants assets/tunes/NAME.cts: fetched and
    //                          handed over in 8 KB chunks, then tune-done
    //   harkfell: bench ...    ?bench's lines: shown, and sent to the host
    var benchEl = document.getElementById("bench");
    var fetched = {}, tries = {};
    function fetchTune(name) {
      if (!/^[a-z0-9-]+$/.test(name) || fetched[name]) return;
      fetched[name] = true;
      fetch("assets/tunes/" + name + ".cts").then(function (r) {
        if (!r.ok) throw new Error("tune " + name + " " + r.status);
        return r.text();
      }).then(function (text) {
        for (var i = 0; i < text.length; i += 8192) send("tune-chunk", text.slice(i, i + 8192));
        send("tune-done", name);
      }, function (err) {
        // a failed fetch is tried again, three times in all, 2 s apart (the
        // wasm asks for a name once; review M4)
        fetched[name] = false;
        tries[name] = (tries[name] || 0) + 1;
        if (tries[name] < 3) setTimeout(function () { fetchTune(name); }, 2000);
        else console.error("harkfell: " + err.message);
      });
    }
    function report(line) {
      benchEl.textContent += line + "\n";
      benchEl.scrollTop = benchEl.scrollHeight;
      try { fetch("bench-report?" + encodeURIComponent(line), { cache: "no-store" }).catch(function () {}); } catch (err) { /* offline */ }
    }
    // D40: the game paused (it lost focus). The sound fades out over 0.12 s
    // ((harkfell audio) audio-pause!) and says "audio hold"; the contexts are
    // suspended once the fade has played, so the device stops asking for
    // audio. "audio release" resumes them at once; the sound fades back in.
    var suspendTimer = null;
    function holdAudio() {
      clearTimeout(suspendTimer);
      suspendTimer = setTimeout(function () {
        suspendTimer = null;
        (window.HARKFELL_CONTEXTS || []).forEach(function (c) {
          if (c.state === "running") c.suspend().catch(function () {});
        });
      }, 150);
    }
    function releaseAudio() {
      clearTimeout(suspendTimer);
      suspendTimer = null;
      (window.HARKFELL_CONTEXTS || []).forEach(function (c) {
        if (c.state === "suspended") c.resume().catch(function () {});
      });
    }
    var log = console.log;
    console.log = function () {
      var line = String(arguments[0] || "");
      if (line === "harkfell: audio hold") holdAudio();
      else if (line === "harkfell: audio release") releaseAudio();
      if (line.indexOf("harkfell: fetch ") === 0) fetchTune(line.slice(16).trim());
      else if (line === "harkfell: frame play") framePlaying();
      else if (line.indexOf("harkfell: bench ") === 0 || (benchOn && line.indexOf("harkfell: audio ") === 0)) report(line);
      return log.apply(console, arguments);
    };
    // Every gesture may resume the audio context (the autoplay policy); the
    // capture phase sees the touch controls' events before they stop them.
    // D39: the fullscreen button and the F key are not gestures to the game:
    // on the start screen they go fullscreen without stepping in.
    ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(function (n) {
      document.addEventListener(n, function (e) {
        if (fsEl.contains(e.target) || (n === "keydown" && fsKey(e))) return;
        send("gesture", n);
      }, true);
    });

    // ---- D39: fullscreen ---------------------------------------------------
    // The button (#fs) or the F key takes the game's container (#game) to
    // fullscreen with the Fullscreen API, and back (Escape also leaves, the
    // browser's own). The view is placed as ever: the largest whole scale
    // that fits the canvas, centred on black ((engine view), D37's rule).
    // Where the API is missing (iPhone Safari) the button stays hidden and
    // F is an ordinary key. Lines: "harkfell: page fullscreen request",
    // then "... on" / "... off" as the browser changes it, or "... refused
    // NAME" if it says no.
    var FS_IDLE_MS = 2500;             // in play, the button fades after this long without the mouse moving
    var gameEl = document.getElementById("game");
    var fsEl = document.getElementById("fs");
    var fsRequest = gameEl.requestFullscreen || gameEl.webkitRequestFullscreen;
    var fsExit = document.exitFullscreen || document.webkitExitFullscreen;
    var fsOK = !!(fsRequest && fsExit && (document.fullscreenEnabled || document.webkitFullscreenEnabled));
    var fsTimer = null;
    function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
    function fsKey(e) {
      return fsOK && (e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey;
    }
    function fsToggle() {
      var p;
      if (fsElement()) p = fsExit.call(document);
      else { console.log("harkfell: page fullscreen request"); p = fsRequest.call(gameEl, { navigationUI: "hide" }); }
      if (p && p.catch) p.catch(function (err) { console.log("harkfell: page fullscreen refused " + (err && err.name)); });
    }
    // Shown now; in play (not the start screen, the card or the opening) it
    // fades after FS_IDLE_MS unless woken again.
    function fsWake() {
      fsEl.classList.remove("faded");
      clearTimeout(fsTimer);
      fsTimer = setTimeout(function () {
        if (inFrame) fsWake();
        else fsEl.classList.add("faded");
      }, FS_IDLE_MS);
    }
    function fsChanged() {
      var on = !!fsElement();
      fsEl.classList.toggle("on", on);
      fsEl.setAttribute("aria-label", on ? "Leave fullscreen" : "Fullscreen");
      console.log("harkfell: page fullscreen " + (on ? "on" : "off"));
      fsWake();
    }
    if (fsOK) {
      fsEl.hidden = false;
      // no focus on a click, so Space (jump) never presses the button
      fsEl.addEventListener("mousedown", function (e) { e.preventDefault(); });
      fsEl.addEventListener("click", function (e) { e.stopPropagation(); fsEl.blur(); fsToggle(); });
      document.addEventListener("keydown", function (e) {
        if (!fsKey(e) || e.repeat) return;
        e.preventDefault();
        fsToggle();
      });
      document.addEventListener("fullscreenchange", fsChanged);
      document.addEventListener("webkitfullscreenchange", fsChanged);
      // the mouse moving wakes it; with no mouse, a touch in the top quarter
      document.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") fsWake(); }, true);
      document.addEventListener("pointerdown", function (e) {
        if (e.pointerType !== "mouse" && e.clientY < window.innerHeight / 4) fsWake();
      }, true);
      fsWake();
    }
    var benchOn = params.has("bench");
    if (benchOn) {
      benchEl.hidden = false;
      benchEl.textContent = "Harkfell sound measurement. Tap anywhere to start; it takes about 3.3 minutes. Leave the phone on this page with the screen on.\n";
      var begun = false;
      document.addEventListener("pointerup", function () {
        if (begun) return;
        begun = true;
        report("harkfell: bench env version " + (document.documentElement.innerHTML.match(/version: "([^"]*)"/) || [0, "?"])[1] +
               " isolated " + (self.crossOriginIsolated ? 1 : 0) + " rate-param " + (params.get("rate") || "32000") +
               " cores " + (navigator.hardwareConcurrency || "?") + " dpr " + (window.devicePixelRatio || 1) +
               " ua " + navigator.userAgent.replace(/\s+/g, "_"));
        withApp(function () { send("gesture", "bench"); send("bench", ""); });
      }, true);
    }
    var warn = console.warn;
    console.warn = function () {
      var s = String(arguments[0] || "");
      if (s.indexOf("FATAL:") >= 0) die("fatal");
      return warn.apply(console, arguments);
    };
    window.addEventListener("error", function (e) {
      if (e.error && e.error instanceof WebAssembly.RuntimeError) die("trap");
    });

    function withApp(fn) {
      if (globalThis.SigilWebApp && globalThis.SigilWebApp.started) { fn(globalThis.SigilWebApp); return; }
      document.addEventListener("sigil-web-app-ready", function (e) { fn(e.detail); }, { once: true });
    }

    var app = null;
    function send(type, payload) {
      if (!app || guard.dead) return 0;
      return app.dispatch(type, payload);
    }

    withApp(function (a) {
      app = a;
      var deliver = app.deliver;
      app.deliver = function (type, payload) {
        if (guard.dead) return -1;
        try { return deliver.call(app, type, payload); }
        catch (err) { die("trap in " + type); throw err; }
      };
      // the stick form first, so the trace's boot line reports the form in
      // force, not the stored one ?stick is about to replace
      var form = params.get("stick");
      if (form === "float" || form === "fixed") send("stick-form", form);
      stick.form = send("stick-form", "?") === 1 ? "float" : "fixed";
      if (params.has("trace")) send("trace", "on");
      if (params.has("ms")) send("ms", "on");
      // the world, then the doors. HARKFELL_WORLD_LIVE, when a tool sets it
      // before the page loads (scripts/shot.mjs), is the working tree's world
      // and wins over the one baked in at build time.
      var files = window.HARKFELL_WORLD_LIVE || window.HARKFELL_WORLD || [];
      if (window.HARKFELL_WORLD_LIVE) console.log("harkfell: page world live " + files.length + " files");
      files.forEach(function (f) { send("world-file", f[0] + "\n" + f[1]); });
      if (files.length) send("world-done", "");
      if (params.get("carry")) send("carry", params.get("carry"));
      if (params.get("tone")) send("tone", params.get("tone"));
      if (params.get("sound")) send("sound", params.get("sound"));
      if (params.has("test-room")) send("test-room", "");
      var room = params.get("room");
      if (room) send("goto", params.get("at") ? room + "@" + params.get("at") : room);
      if (params.has("atlas")) setView("atlas");
      else if (params.get("sheet")) setView("sheet:" + params.get("sheet"));
      if (params.has("still")) send("still", "on");
      // A4: no door asked, so the game begins: the start screen (the
      // gesture gate the audio needs), the card, the opening, and the save.
      // The touch controls wait for "harkfell: frame play".
      // A4 look: ?look=start|card shows the start screen or the card alone,
      // to look at (the frame itself is the plain boot's); like a door, it
      // begins no game. The pointer is handed over as in the frame.
      // &over=X (0..1): D40's hold-to-start-over line, as if a save existed
      // and the hold were X of the way (&kind=keys|touch|both, the lines).
      var look = params.get("look");
      if (look === "start" || look === "card") {
        var lookTouchy = (navigator.maxTouchPoints || 0) > 0;
        inFrame = true;
        touchLayer.classList.remove("on");
        send("look", look + " " + (params.get("kind") || (coarse ? "touch" : (lookTouchy ? "both" : "keys"))) +
             (params.get("over") !== null ? " over=" + params.get("over") : ""));
      }
      // ?look=reveal: play as a door does, with D35's reveal of the name over
      // the room once, as the game will (a key or a tap plays it again; &hold
      // keeps it at full strength to study it); the controls stay, play goes on
      if (look === "reveal") send("look", "reveal both" + (params.has("hold") ? " hold" : ""));
      var door = room || params.has("atlas") || params.get("sheet") || params.has("test-room") ||
                 params.has("replay") || params.has("envelope") || params.has("bench") || params.get("carry") ||
                 params.get("frame") === "off" || look === "start" || look === "card" || look === "reveal";
      if (files.length && !door) {
        var touchy = (navigator.maxTouchPoints || 0) > 0;
        var kind = coarse ? "touch" : (touchy ? "both" : "keys");
        inFrame = true;
        touchLayer.classList.remove("on");
        send("begin", kind + (params.has("new") ? " new" : ""));
      }
      layout();
      if (params.has("replay")) setTimeout(function () { send("replay", ""); }, 50);
      if (params.has("envelope")) setTimeout(function () { send("envelope", ""); }, 50);
    });
    document.getElementById("stage").addEventListener("webglcontextlost", function () { die("webgl context lost"); });

    // The atlas and the sheet: the touch controls are hidden and a tap or a
    // click on the canvas enters the room under it (the game maps canvas
    // pixels to rooms).
    var view = "play";
    // A4: while the frame runs (start screen, card, opening) the touch
    // controls are hidden, a touch anywhere is the gesture, and the pointer
    // is handed over for the start screen's moths.
    var inFrame = false;
    function framePlaying() {
      inFrame = false;
      if (fsOK) fsWake();             // D39: the fade's count starts with play
      if (view === "play" && (coarse || params.has("touch"))) touchLayer.classList.add("on");
    }
    document.getElementById("stage").addEventListener("pointermove", function (e) {
      if (!inFrame) return;
      var r = e.target.getBoundingClientRect();
      send("pointer", ((e.clientX - r.left) * e.target.width / r.width).toFixed(1) + "," +
                      ((e.clientY - r.top) * e.target.height / r.height).toFixed(1));
    });
    // D40: a press and its end during the frame. With a save, the start
    // screen's start-over line is held by a long press on it; a press
    // elsewhere steps in (the game decides which, by where it landed).
    document.getElementById("stage").addEventListener("pointerdown", function (e) {
      if (!inFrame) return;
      var r = e.target.getBoundingClientRect();
      send("press", ((e.clientX - r.left) * e.target.width / r.width).toFixed(1) + "," +
                    ((e.clientY - r.top) * e.target.height / r.height).toFixed(1));
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) {
      document.getElementById("stage").addEventListener(n, function () {
        if (inFrame) send("release", "");
      });
    });
    function setView(v) {
      view = v;
      send("view", v);
      if (v === "play") { if (coarse || params.has("touch")) touchLayer.classList.add("on"); }
      else touchLayer.classList.remove("on");
    }
    var stageEl = document.getElementById("stage");
    stageEl.addEventListener("pointerup", function (e) {
      if (view === "play") return;
      var r = stageEl.getBoundingClientRect();
      var x = (e.clientX - r.left) * stageEl.width / r.width;
      var y = (e.clientY - r.top) * stageEl.height / r.height;
      if (send("tap", x.toFixed(1) + "," + y.toFixed(1)) === 1) setView("play");
    });

    // A lost focus (alt-tab with the window still visible) releases the keys
    // and the touch controls too: a keyup that goes to another window would
    // otherwise hold the key forever.
    window.addEventListener("blur", function () { send("visibility", "blur"); releaseAll(); });
    // D40: the game pauses on blur or hidden and resumes on focus or visible.
    window.addEventListener("focus", function () { send("visibility", "focus"); });
    document.addEventListener("visibilitychange", function () {
      send("visibility", document.visibilityState);
      if (document.visibilityState === "hidden") releaseAll();
    });

    // ---- the touch controls ----------------------------------------------
    var touchLayer = document.getElementById("touch");
    var ringEl = document.getElementById("ring");
    var knobEl = document.getElementById("knob");
    var jumpEl = document.getElementById("jumpbtn");
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (coarse || params.has("touch")) touchLayer.classList.add("on");

    // Sizes in CSS px, from the short side of the screen.
    var stick = { form: "fixed", r: 60, homeX: 0, homeY: 0, cx: 0, cy: 0, id: null };
    var jump = { r: 46, x: 0, y: 0, id: null };

    function place(el, x, y, r) {
      el.style.width = el.style.height = (2 * r) + "px";
      el.style.left = (x - r) + "px";
      el.style.top = (y - r) + "px";
    }

    function layout() {
      var w = window.innerWidth, h = window.innerHeight;
      var s = Math.min(w, h);
      stick.r = Math.max(44, Math.round(s * 0.17));
      jump.r = Math.max(36, Math.round(s * 0.13));
      stick.homeX = stick.r + Math.round(s * 0.08);
      stick.homeY = h - stick.r - Math.round(s * 0.08);
      jump.x = w - jump.r - Math.round(s * 0.1);
      jump.y = h - jump.r - Math.round(s * 0.1);
      if (stick.id === null) { stick.cx = stick.homeX; stick.cy = stick.homeY; }
      place(ringEl, stick.cx, stick.cy, stick.r);
      place(knobEl, stick.cx, stick.cy, Math.round(stick.r * 0.42));
      place(jumpEl, jump.x, jump.y, jump.r);
    }
    window.addEventListener("resize", layout);
    layout();

    function stickVector(x, y, t) {
      var dx = (x - stick.cx) / stick.r, dy = (y - stick.cy) / stick.r;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > 1) { dx /= len; dy /= len; }
      place(knobEl, stick.cx + dx * stick.r, stick.cy + dy * stick.r, Math.round(stick.r * 0.42));
      send("stick", dx.toFixed(4) + "," + dy.toFixed(4) + "," + t.toFixed(3));
    }

    // Does a touch at (x, y) take the stick?
    function takesStick(x, y) {
      var w = window.innerWidth, h = window.innerHeight;
      var dx = x - stick.homeX, dy = y - stick.homeY;
      var inRing = Math.sqrt(dx * dx + dy * dy) <= stick.r * 1.5;
      if (stick.form === "fixed") return inRing;
      return inRing || (x < w / 2 && y > h / 2);
    }

    function releaseStick(t) {
      stick.id = null;
      stick.cx = stick.homeX; stick.cy = stick.homeY;
      ringEl.classList.remove("live");
      place(ringEl, stick.cx, stick.cy, stick.r);
      place(knobEl, stick.cx, stick.cy, Math.round(stick.r * 0.42));
      send("stick", "0,0," + t.toFixed(3));
    }
    function releaseJump(t) {
      jump.id = null;
      jumpEl.classList.remove("down");
      send("jump", "0," + t.toFixed(3));
    }
    function releaseAll() {
      var t = performance.now();
      if (stick.id !== null) releaseStick(t);
      if (jump.id !== null) releaseJump(t);
    }

    touchLayer.addEventListener("pointerdown", function (e) {
      e.preventDefault(); e.stopPropagation();
      var x = e.clientX, y = e.clientY;
      if (stick.id === null && takesStick(x, y)) {
        stick.id = e.pointerId;
        if (stick.form === "float") { stick.cx = x; stick.cy = y; }
        ringEl.classList.add("live");
        place(ringEl, stick.cx, stick.cy, stick.r);
        try { touchLayer.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointers */ }
        stickVector(x, y, e.timeStamp);
      } else if (jump.id === null && x >= window.innerWidth / 2) {
        jump.id = e.pointerId;
        jumpEl.classList.add("down");
        try { touchLayer.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointers */ }
        send("jump", "1," + e.timeStamp.toFixed(3));
      }
    });
    touchLayer.addEventListener("pointermove", function (e) {
      if (e.pointerId !== stick.id) return;
      e.preventDefault(); e.stopPropagation();
      stickVector(e.clientX, e.clientY, e.timeStamp);
    });
    function up(e) {
      if (e.pointerId === stick.id) releaseStick(e.timeStamp);
      else if (e.pointerId === jump.id) releaseJump(e.timeStamp);
    }
    touchLayer.addEventListener("pointerup", up);
    touchLayer.addEventListener("pointercancel", up);
    // The loader turns a swipe anywhere into an arrow key pulse; the
    // controls' own touches must never reach it.
    ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (name) {
      touchLayer.addEventListener(name, function (e) { e.stopPropagation(); e.preventDefault(); }, { passive: false });
    });
  })();
  </script>
  <script>
  // Substratic's page script (assets/substratic/substratic.js), here for the
  // playtest reports only (?playtest: F1, F2, and the i and report buttons on a
  // phone). This page keeps its own touch controls, focus handling, fullscreen
  // button and update line, so those parts are off.
  window.SUBSTRATIC = {
    canvas: "#stage", sticks: [], buttons: [], playtest: "param",
    reportUrl: "playtest-report", versionUrl: null, fullscreen: false,
    gamepad: false, focus: false
  };
  </script>
  <script src="assets/substratic/substratic.js"></script>
  <!--sigil:app-->
</body>
